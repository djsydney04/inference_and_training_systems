<title id="title">The organization of an accelerator</title><desc id="desc">An original top-down conceptual accelerator illustration. Repeated compute tiles sit in the central die. Memory banks on either side connect through fine traces; blue emphasizes data movement. Not a vendor floorplan or a physical scale drawing.</desc>
