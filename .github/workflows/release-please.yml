name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    outputs:
      pr-sha: ${{ steps.candidate.outputs.sha }}
      release-created: ${{ steps.release.outputs.release_created }}
      release-tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Version the material changes
        id: content
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ fromJSON(steps.release.outputs.pr || '{}').number }}
        run: node --experimental-strip-types scripts/finalize-content-history.ts
      # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
      # Capture and verify the exact generated commit within this workflow.
      - name: Identify the generated release commit
        if: steps.release.outputs.pr != ''
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.content.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          release_sha="$RELEASE_SHA"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$GH_REPO/statuses/$release_sha" \
            -f state=pending -f context=release-validation \
            -f description="Checking generated version, tests, build and footer" \
            -f target_url="$RUN_URL"

  deploy:
    needs: release
    if: needs.release.outputs.release-created == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      tag_name: ${{ needs.release.outputs.release-tag }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  verify-release-pr:
    needs: release
    if: needs.release.outputs.pr-sha != ''
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.release.outputs.pr-sha }}

  release-pr-status:
    needs: [release, verify-release-pr]
    if: always() && needs.release.outputs.pr-sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Report validation on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.release.outputs.pr-sha }}
          RESULT: ${{ needs.verify-release-pr.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GH_REPO/statuses/$RELEASE_SHA" \
            -f state="$state" -f context=release-validation \
            -f description="Release validation: $RESULT" -f target_url="$RUN_URL"
