name: Deploy Release to Vercel

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: Release tag to deploy
        required: true
        type: string
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to deploy (for example, v0.3.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag_name || github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Check Vercel secrets
        shell: bash
        run: |
          for secret in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing repository secret: $secret"
              exit 1
            fi
          done

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel config
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
